<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Den Market | Buyurtma</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a, #0a192f);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .logo {
            font-size: 3rem;
        }
        .title {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #ffd89b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 5px;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .card {
            background: rgba(255,255,240,0.08);
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .item-name {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .price {
            font-size: 0.8rem;
            color: #ffd89b;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .qty-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #ffd89b;
            cursor: pointer;
        }
        .cart-section {
            background: rgba(0,0,0,0.5);
            border-radius: 28px;
            padding: 20px;
            margin-top: 10px;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #ffd89b;
        }
        .cart-items {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .total {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 2px solid rgba(255,255,255,0.1);
            font-weight: bold;
        }
        .total-amount {
            color: #ffd89b;
        }
        .input-group {
            margin: 15px 0;
        }
        .input-label {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.9);
            font-size: 0.9rem;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd89b, #ffb347);
            color: #1a1a2e;
            cursor: pointer;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            font-size: 0.8rem;
            color: #ffd89b;
            margin-top: 10px;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 20px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🏪📦</div>
        <div class="title">DEN MARKET</div>
        <div class="subtitle">Premium sifat · Tez yetkazib berish</div>
    </div>

    <div class="menu-list" id="menuList"></div>

    <div class="cart-section">
        <div class="cart-header">
            <span>🛒 SAVATCHA</span>
            <button id="clearCartBtn" style="background:none; border:none; color:#ff6b6b; cursor:pointer;">🗑️ Tozalash</button>
        </div>
        <div id="cartItems" class="cart-items">Savat bo'sh</div>
        <div class="total">
            <span>💰 Jami</span>
            <span id="totalAmount" class="total-amount">0 so'm</span>
        </div>

        <div class="input-group">
            <div class="input-label">📞 Telefon raqam</div>
            <input type="tel" id="phone" placeholder="+998 __ ___ __ __">
        </div>

        <button id="orderBtn" class="btn">✅ BUYURTMA BERISH</button>
        <div id="statusMsg" class="loading"></div>
    </div>
    <footer>Den Market 2026 | Sifatli xizmat</footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Mahsulotlar
        const PRODUCTS = [
            { name: "Kartoshka", price: 7000, weight: "1 kg", category: "sabzavot" },
            { name: "Piyoz", price: 2000, weight: "1 kg", category: "sabzavot" },
            { name: "Sabzi qizil", price: 4000, weight: "1 kg", category: "sabzavot" },
            { name: "Sabzi sariq", price: 3300, weight: "1 kg", category: "sabzavot" },
            { name: "Guruch xorazm Lazer", price: 14000, weight: "1 kg", category: "guruch" },
            { name: "Guruch Rishton Lazer", price: 13000, weight: "1 kg", category: "guruch" },
            { name: "Tuz roxat", price: 5000, weight: "1 kg", category: "boshqa" },
            { name: "Kok Choy", price: 20000, weight: "0.5 kg", category: "boshqa" },
            { name: "Donya yog'", price: 100000, weight: "5 L", category: "yog" },
            { name: "Farg'ona yog'", price: 68000, weight: "3.6 kg", category: "yog" },
            { name: "Lazzat yog'", price: 100000, weight: "5 L", category: "yog" }
        ];

        let cart = JSON.parse(localStorage.getItem('den_market_cart')) || {};
        let userLocation = null;           // { lat, lon }
        let locationRequested = false;     // so‘rov yuborilganmi?

        // Savat va menyu funksiyalari
        function renderMenu() {
            const container = document.getElementById('menuList');
            container.innerHTML = '';
            for (const p of PRODUCTS) {
                const qty = cart[p.name] || 0;
                container.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="item-name">${p.name} <span style="font-size:0.7rem;">(${p.weight})</span></div>
                            <div class="price">${p.price.toLocaleString()} so'm</div>
                        </div>
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="changeQty('${p.name.replace(/'/g, "\\'")}', -1)">−</button>
                            <span style="min-width:25px; text-align:center;">${qty}</span>
                            <button class="qty-btn" onclick="changeQty('${p.name.replace(/'/g, "\\'")}', 1)">+</button>
                        </div>
                    </div>
                `;
            }
        }

        window.changeQty = function(name, delta) {
            let current = cart[name] || 0;
            let newVal = current + delta;
            if (newVal < 0) newVal = 0;
            if (newVal === 0) delete cart[name];
            else cart[name] = newVal;
            localStorage.setItem('den_market_cart', JSON.stringify(cart));
            renderMenu();
            updateCart();
        };

        function updateCart() {
            const cartDiv = document.getElementById('cartItems');
            let total = 0;
            cartDiv.innerHTML = '';
            for (const [name, qty] of Object.entries(cart)) {
                const p = PRODUCTS.find(i => i.name === name);
                if (!p) continue;
                const sum = p.price * qty;
                total += sum;
                cartDiv.innerHTML += `<div class="cart-item"><span>${name} x${qty}</span><span>${sum.toLocaleString()} so'm</span></div>`;
            }
            if (Object.keys(cart).length === 0) cartDiv.innerHTML = 'Savat bo\'sh';
            document.getElementById('totalAmount').innerHTML = total.toLocaleString() + ' so\'m';
        }

        document.getElementById('clearCartBtn').addEventListener('click', () => {
            if (confirm("Savatni tozalansinmi?")) {
                cart = {};
                localStorage.setItem('den_market_cart', JSON.stringify(cart));
                renderMenu();
                updateCart();
            }
        });

        // Lokatsiyani qabul qilish va buyurtmani yakunlash
        let pendingOrder = null;  // buyurtma ma'lumotlari (phone, total) kutilayotgan

        function sendOrder(phone, total) {
            if (!userLocation) {
                // Lokatsiya hali yo‘q – so‘raymiz
                pendingOrder = { phone, total };
                if (!locationRequested) {
                    locationRequested = true;
                    document.getElementById('statusMsg').innerHTML = '⏳ Lokatsiya so‘ralmoqda...';
                    tg.requestLocation();
                } else {
                    document.getElementById('statusMsg').innerHTML = '❌ Iltimos, lokatsiyaga ruxsat bering!';
                }
                return;
            }
            // Lokatsiya bor – yuboramiz
            const orderData = {
                cart: cart,
                total: total,
                phone: phone,
                location: { lat: userLocation.lat, lon: userLocation.lon }
            };
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        }

        // Lokatsiya kelganda
        tg.onEvent('locationSent', (loc) => {
            userLocation = { lat: loc.latitude, lon: loc.longitude };
            document.getElementById('statusMsg').innerHTML = `✅ Lokatsiya qabul qilindi! (${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)})`;
            if (pendingOrder) {
                // kutib turgan buyurtmani yuboramiz
                sendOrder(pendingOrder.phone, pendingOrder.total);
                pendingOrder = null;
            }
        });

        tg.onEvent('locationFailed', (err) => {
            document.getElementById('statusMsg').innerHTML = '❌ Lokatsiya yuborilmadi. Iltimos, ruxsat bering.';
            locationRequested = false;
            pendingOrder = null;
        });

        // Buyurtma tugmasi
        document.getElementById('orderBtn').addEventListener('click', () => {
            const phone = document.getElementById('phone').value.trim();
            if (Object.keys(cart).length === 0) {
                tg.showPopup({ title: "Xatolik", message: "Mahsulot tanlang!" });
                return;
            }
            if (!phone) {
                tg.showPopup({ title: "Xatolik", message: "Telefon raqam kiriting!" });
                return;
            }
            const total = Object.entries(cart).reduce((s, [n,q]) => s + (PRODUCTS.find(p=>p.name===n)?.price * q || 0), 0);
            // Agar lokatsiya allaqachon olingan bo‘lsa, darhol yuboramiz
            if (userLocation) {
                sendOrder(phone, total);
            } else {
                // Lokatsiya yo‘q – so‘raymiz va kutamiz
                pendingOrder = { phone, total };
                if (!locationRequested) {
                    locationRequested = true;
                    document.getElementById('statusMsg').innerHTML = '⏳ Lokatsiya so‘ralmoqda...';
                    tg.requestLocation();
                } else {
                    document.getElementById('statusMsg').innerHTML = '❌ Iltimos, lokatsiyaga ruxsat bering!';
                }
            }
        });

        renderMenu();
        updateCart();
    </script>
</body>
</html>
