<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Den Market | Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0a0a, #030318);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        /* HAVODA UCHADIGAN HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px 0;
            animation: floatHeader 3s ease-in-out infinite;
        }

        @keyframes floatHeader {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 10px rgba(255, 216, 155, 0.4));
            animation: iconGlow 2s ease-in-out infinite;
        }

        @keyframes iconGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 216, 155, 0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 216, 155, 0.7)); }
        }

        .brand-name {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffd89b, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-slogan {
            font-size: 0.7rem;
            color: #ffd89b;
            letter-spacing: 2px;
            margin-top: 8px;
            animation: textFloat 2s ease-in-out infinite;
        }

        @keyframes textFloat {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 8px rgba(255, 216, 155, 0.5); }
        }

        /* Qidiruv */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box, select {
            padding: 14px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 216, 155, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
        }

        .search-box { flex: 2; }
        select { flex: 1; }

        .search-box:focus, select:focus {
            outline: none;
            border-color: #ffd89b;
        }

        /* Mahsulotlar */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .product-card {
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .product-weight {
            font-size: 0.7rem;
            color: #ffd89b;
            background: rgba(255, 216, 155, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-left: 6px;
        }

        .product-price {
            font-size: 0.8rem;
            color: #ffd89b;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            background: rgba(255, 216, 155, 0.15);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: #ffd89b;
            cursor: pointer;
        }

        /* Savatcha */
        .cart-section {
            background: rgba(10, 10, 25, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid rgba(255, 216, 155, 0.15);
            animation: floatCart 4s ease-in-out infinite;
        }

        @keyframes floatCart {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 216, 155, 0.15);
        }

        .cart-title { font-size: 1.1rem; font-weight: 600; color: #ffd89b; }
        .clear-cart { background: none; border: none; color: #ff6b6b; cursor: pointer; }

        .cart-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            color: #ffd89b;
        }

        .total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 216, 155, 0.2);
            font-weight: bold;
        }

        .total-amount { color: #ffd89b; font-size: 1.2rem; }

        /* TELEFON + LOKATSIYA BIR QATODA */
        .info-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 12px 0;
        }

        .phone-input {
            flex: 2;
            padding: 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 216, 155, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.9rem;
        }

        .location-send-btn {
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            background: linear-gradient(135deg, #2a5a35, #1e3a25);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .location-send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(60, 110, 71, 0.5);
        }

        .location-info {
            font-size: 0.7rem;
            text-align: center;
            color: #ffd89b;
            margin-bottom: 12px;
        }

        .order-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd89b, #ffb347);
            color: #0a0a0a;
            cursor: pointer;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 20px;
            opacity: 0.5;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <span class="brand-icon">🏪</span>
                <span class="brand-name">DEN MARKET</span>
                <span class="brand-icon">📦</span>
            </div>
            <div class="brand-slogan">PREMIUM SIFAT · TEZ YETKAZIB BERISH</div>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Mahsulot qidirish...">
            <select id="categorySelect">
                <option value="all">📋 HAMMASI</option>
                <option value="sabzavot">🥕 SABZAVOTLAR</option>
                <option value="guruch">🍚 GURUCHLAR</option>
                <option value="yog">🛢️ YOG'LAR</option>
                <option value="boshqa">📦 BOSHQALAR</option>
            </select>
        </div>

        <div class="menu-list" id="menuList"></div>

        <div class="cart-section">
            <div class="cart-header">
                <span class="cart-title">🛒 SAVATCHA</span>
                <button class="clear-cart" id="clearCartBtn">🗑️ Tozalash</button>
            </div>
            <div class="cart-items" id="cartItems">Savat bo'sh</div>
            <div class="total">
                <span>💰 JAMI</span>
                <span class="total-amount" id="totalAmount">0 so'm</span>
            </div>

            <!-- TELEFON + LOKATSIYA BIR QATORDA (MANZIL YOZUVSIZ) -->
            <div class="info-row">
                <input type="tel" id="phone" class="phone-input" placeholder="📞 Telefon raqam">
                <button class="location-send-btn" id="locationBtn">📍 Lokatsiya</button>
            </div>
            <div id="locationInfo" class="location-info"></div>

            <button class="order-btn" id="orderBtn">✅ BUYURTMA BERISH</button>
        </div>
        <footer>Den Market 2026 | Premium sifat · Tez yetkazib berish</footer>
    </div>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            const PRODUCTS = [
                { name: "Kartoshka", price: 7000, weight: "1 kg", category: "sabzavot" },
                { name: "Piyoz", price: 2000, weight: "1 kg", category: "sabzavot" },
                { name: "Sabzi qizil", price: 4000, weight: "1 kg", category: "sabzavot" },
                { name: "Sabzi sariq", price: 3300, weight: "1 kg", category: "sabzavot" },
                { name: "Guruch xorazm Lazer", price: 14000, weight: "1 kg", category: "guruch" },
                { name: "Guruch Rishton Lazer", price: 13000, weight: "1 kg", category: "guruch" },
                { name: "Tuz roxat", price: 5000, weight: "1 kg", category: "boshqa" },
                { name: "Kok Choy", price: 20000, weight: "0.5 kg", category: "boshqa" },
                { name: "Donya yog'", price: 100000, weight: "5 L", category: "yog" },
                { name: "Farg'ona yog'", price: 68000, weight: "3.6 kg", category: "yog" },
                { name: "Lazzat yog'", price: 100000, weight: "5 L", category: "yog" }
            ];

            let cart = JSON.parse(localStorage.getItem('den_market_cart')) || {};
            let searchTerm = '';
            let selectedCategory = 'all';
            let currentLocation = null;

            function renderMenu() {
                const container = document.getElementById('menuList');
                if (!container) return;
                container.innerHTML = '';
                const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(searchTerm) && (selectedCategory === 'all' || p.category === selectedCategory));
                if (filtered.length === 0) {
                    container.innerHTML = '<div class="no-results">❌ Hech narsa topilmadi</div>';
                    return;
                }
                for (const p of filtered) {
                    const qty = cart[p.name] || 0;
                    container.innerHTML += `
                        <div class="product-card">
                            <div>
                                <div class="product-name">${p.name} <span class="product-weight">${p.weight}</span></div>
                                <div class="product-price">${p.price.toLocaleString()} so'm</div>
                            </div>
                            <div class="quantity-control">
                                <button class="qty-btn" onclick="changeQty('${p.name.replace(/'/g, "\\'")}', -1)">−</button>
                                <span style="min-width:25px; text-align:center;">${qty}</span>
                                <button class="qty-btn" onclick="changeQty('${p.name.replace(/'/g, "\\'")}', 1)">+</button>
                            </div>
                        </div>
                    `;
                }
            }

            window.changeQty = function(name, delta) {
                let current = cart[name] || 0;
                let newVal = current + delta;
                if (newVal < 0) newVal = 0;
                if (newVal === 0) delete cart[name];
                else cart[name] = newVal;
                localStorage.setItem('den_market_cart', JSON.stringify(cart));
                renderMenu();
                updateCart();
            };

            function updateCart() {
                const cartDiv = document.getElementById('cartItems');
                let total = 0;
                cartDiv.innerHTML = '';
                for (const [name, qty] of Object.entries(cart)) {
                    const p = PRODUCTS.find(i => i.name === name);
                    if (!p) continue;
                    const sum = p.price * qty;
                    total += sum;
                    cartDiv.innerHTML += `
                        <div class="cart-item">
                            <span>${name} x${qty}</span>
                            <div class="cart-item-controls">
                                <span>${sum.toLocaleString()} so'm</span>
                                <button class="cart-item-btn" onclick="changeQty('${name.replace(/'/g, "\\'")}', -1)">−</button>
                                <button class="cart-item-btn" onclick="changeQty('${name.replace(/'/g, "\\'")}', 1)">+</button>
                            </div>
                        </div>
                    `;
                }
                if (Object.keys(cart).length === 0) cartDiv.innerHTML = 'Savat bo\'sh';
                document.getElementById('totalAmount').innerHTML = total.toLocaleString() + ' so\'m';
            }

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                renderMenu();
            });

            document.getElementById('categorySelect').addEventListener('change', (e) => {
                selectedCategory = e.target.value;
                renderMenu();
            });

            document.getElementById('clearCartBtn').addEventListener('click', () => {
                if (confirm("Savatni tozalansinmi?")) {
                    cart = {};
                    localStorage.setItem('den_market_cart', JSON.stringify(cart));
                    renderMenu();
                    updateCart();
                }
            });

            // LOKATSIYA TUGMASI
            const locationBtn = document.getElementById('locationBtn');
            const locationInfo = document.getElementById('locationInfo');

            locationBtn.addEventListener('click', () => {
                locationInfo.innerHTML = '⏳ Lokatsiya so‘ralmoqda...';
                tg.requestLocation();
            });

            tg.onEvent('locationSent', (loc) => {
                currentLocation = loc;
                const lat = loc.latitude.toFixed(6);
                const lon = loc.longitude.toFixed(6);
                locationInfo.innerHTML = '✅ Lokatsiya qabul qilindi!<br>📍 ' + lat + ', ' + lon;
            });

            tg.onEvent('locationFailed', () => {
                locationInfo.innerHTML = '❌ Lokatsiya yuborilmadi. Ruxsat bering.';
            });

            // BUYURTMA BERISH
            document.getElementById('orderBtn').addEventListener('click', () => {
                const phone = document.getElementById('phone').value.trim();
                if (Object.keys(cart).length === 0) {
                    tg.showPopup({ title: "Xatolik", message: "Mahsulot tanlang!" });
                    return;
                }
                if (!phone) {
                    tg.showPopup({ title: "Xatolik", message: "Telefon raqam kiriting!" });
                    return;
                }
                if (!currentLocation) {
                    tg.showPopup({ title: "Xatolik", message: "Iltimos, lokatsiyani yuboring!" });
                    return;
                }

                const total = Object.entries(cart).reduce((s, [n,q]) => s + (PRODUCTS.find(p=>p.name===n)?.price * q || 0), 0);
                const orderData = {
                    cart: cart,
                    total: total,
                    phone: phone,
                    location: currentLocation,
                    address: currentLocation ? `${currentLocation.latitude}, ${currentLocation.longitude}` : ''
                };
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            });

            renderMenu();
            updateCart();
        })();
    </script>
</body>
</html>
