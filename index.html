<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Den Market | Lokatsiya</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        button {
            background: #3c6e47;
            color: white;
            padding: 16px 24px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
        }
        .info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ffd89b;
        }
    </style>
</head>
<body>
    <h1>🏪 DEN MARKET</h1>
    <p>📦 Premium sifat · Tez yetkazib berish</p>

    <button id="locationBtn">📍 Lokatsiyani yuborish</button>
    <div id="locationInfo" class="info"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const btn = document.getElementById('locationBtn');
        const info = document.getElementById('locationInfo');

        btn.addEventListener('click', function() {
            info.innerHTML = '⏳ Lokatsiya so‘ralmoqda...';
            tg.requestLocation();
        });

        tg.onEvent('locationSent', function(location) {
            info.innerHTML = '✅ Lokatsiya qabul qilindi!<br>📍 ' + location.latitude.toFixed(4) + ', ' + location.longitude.toFixed(4);
        });

        tg.onEvent('locationFailed', function() {
            info.innerHTML = '❌ Lokatsiya yuborilmadi. Ruxsat bermagan bo‘lishingiz mumkin.';
        });
    </script>
</body>
</html>
