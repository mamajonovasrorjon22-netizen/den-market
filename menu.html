<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Den Market | Do'koningiz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a, #0a192f);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .logo {
            font-size: 3rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        .title {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #ffd89b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255,255,240,0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .item-info {
            flex: 2;
        }

        .item-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
            color: #fff;
        }

        .price-unit {
            font-size: 0.85rem;
            color: #ffd89b;
            font-weight: bold;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd89b;
            cursor: pointer;
        }

        .qty-value {
            font-size: 1.1rem;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
            color: #fff;
        }

        .cart-section {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cart-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffd89b;
        }

        .cart-items {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 2px solid rgba(255,255,255,0.1);
            font-weight: bold;
        }

        .total-amount {
            color: #ffd89b;
            font-size: 1.2rem;
        }

        .input-group {
            margin: 15px 0;
        }

        .input-label {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-bottom: 5px;
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.9);
            font-size: 0.9rem;
        }

        textarea {
            border-radius: 20px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd89b, #c7e9fb);
            color: #1a1a2e;
            cursor: pointer;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 20px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🏪📦</div>
        <div class="title">DEN MARKET</div>
        <div class="subtitle">Hamma narsa bor, sifatli va arzon</div>
    </div>

    <div class="menu-list" id="menuList"></div>

    <div class="cart-section">
        <div class="cart-header">🛒 SAVATCHA</div>
        <div class="cart-items" id="cartItems">Savat bo'sh</div>
        <div class="total">
            <span>💰 Jami</span>
            <span class="total-amount" id="totalAmount">0 so'm</span>
        </div>

        <div class="input-group">
            <div class="input-label">📞 Telefon raqam</div>
            <input type="tel" id="phone" placeholder="+998 __ ___ __ __">
        </div>

        <div class="input-group">
            <div class="input-label">📍 Yetkazib berish manzili</div>
            <textarea id="address" rows="2" placeholder="Ko'cha, uy, tuman, shahar..."></textarea>
        </div>

        <button class="btn" id="orderBtn">✅ BUYURTMA BERISH</button>
    </div>
    <footer>Den Market 2026 | Sifatli xizmat</footer>

    <script>
        const MENU = [
            { name: "Kartoshka", price: 7000 },
            { name: "Piyoz", price: 2000 },
            { name: "Sabzi qizil", price: 4000 },
            { name: "Sabzi sariq", price: 3300 },
            { name: "Guruch xorazm Lazer", price: 14000 },
            { name: "Guruch Rishton Lazer", price: 13000 },
            { name: "Tuz roxat", price: 5000 },
            { name: "Kok Choy 0.5kg", price: 20000 },
            { name: "Donya yog' 5L", price: 100000 },
            { name: "Farg'ona yog' 3.6kg", price: 68000 },
            { name: "Lazzat yog' 5L", price: 100000 }
        ];

        let cart = {};
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function renderMenu() {
            const container = document.getElementById('menuList');
            container.innerHTML = '';
            for (const item of MENU) {
                const name = item.name;
                const qty = cart[name] || 0;
                container.innerHTML += `
                    <div class="card">
                        <div class="item-info">
                            <div class="item-name">${name}</div>
                            <div class="price-unit">${item.price.toLocaleString()} so'm</div>
                        </div>
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="changeQty('${name.replace(/'/g, "\\'")}', -1)">−</button>
                            <span id="qty-${name.replace(/\s/g,'')}">${qty}</span>
                            <button class="qty-btn" onclick="changeQty('${name.replace(/'/g, "\\'")}', 1)">+</button>
                        </div>
                    </div>
                `;
            }
        }

        function changeQty(name, delta) {
            let current = cart[name] || 0;
            let newVal = current + delta;
            if (newVal < 0) newVal = 0;
            if (newVal === 0) delete cart[name];
            else cart[name] = newVal;
            const span = document.getElementById(`qty-${name.replace(/\s/g,'')}`);
            if (span) span.innerText = cart[name] || 0;
            updateCart();
        }

        function updateCart() {
            const cartDiv = document.getElementById('cartItems');
            let total = 0;
            cartDiv.innerHTML = '';
            for (const [name, qty] of Object.entries(cart)) {
                const item = MENU.find(i => i.name === name);
                if (!item) continue;
                const sum = item.price * qty;
                total += sum;
                cartDiv.innerHTML += `<div class="cart-item"><span>${name} x${qty}</span><span>${sum.toLocaleString()} so'm</span></div>`;
            }
            if (Object.keys(cart).length === 0) cartDiv.innerHTML = 'Savat bo\'sh';
            document.getElementById('totalAmount').innerHTML = total.toLocaleString() + ' so\'m';
        }

        document.getElementById('orderBtn').onclick = () => {
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            if (Object.keys(cart).length === 0) {
                tg.showPopup({ title: "Xatolik", message: "Mahsulot tanlang!" });
                return;
            }
            if (!phone) {
                tg.showPopup({ title: "Xatolik", message: "Telefon raqam kiriting!" });
                return;
            }
            if (!address) {
                tg.showPopup({ title: "Xatolik", message: "Manzil kiriting!" });
                return;
            }
            const total = Object.entries(cart).reduce((s, [i,q]) => {
                const item = MENU.find(it => it.name === i);
                return s + (item ? item.price * q : 0);
            }, 0);
            tg.sendData(JSON.stringify({ cart, total, phone, address }));
            tg.close();
        };

        renderMenu();
    </script>
</body>
</html>
